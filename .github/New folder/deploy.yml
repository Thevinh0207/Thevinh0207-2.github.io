name: Deploy to GitHub Pages

on:
  # Run every time you push to the main branch
  push:
    branches: [ main ]
  # Also allow starting the workflow by hand from the Actions tab
  workflow_dispatch:

# Allow the workflow to read the repository and publish a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5